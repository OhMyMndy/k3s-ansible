---
# K3s with Cilium Installation Playbook
# Usage: ansible-playbook site.yml

- name: Prepare all nodes
  hosts: k3s_cluster
  become: true
  roles:
    - prereqs

- name: Install K3s server (control plane)
  hosts: k3s_server
  become: true
  roles:
    - k3s-server

- name: Install K3s agents (worker nodes)
  hosts: k3s_agents
  become: true
  roles:
    - k3s-agent

- name: Install Cilium CNI
  hosts: k3s_server
  become: true
  roles:
    - cilium
