---
# Cilium CNI Installation

- name: Check if Helm is installed
  command: which helm
  register: helm_check
  ignore_errors: true
  changed_when: false

- name: Download Helm install script
  get_url:
    url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
    dest: /tmp/get_helm.sh
    mode: '0755'
  when: helm_check.rc != 0

- name: Install Helm
  command: /tmp/get_helm.sh
  when: helm_check.rc != 0

- name: Add Cilium Helm repository
  kubernetes.core.helm_repository:
    name: cilium
    repo_url: "{{ cilium_helm_repo }}"
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Wait for kube-system namespace
  command: k3s kubectl get namespace kube-system
  register: ns_result
  until: ns_result.rc == 0
  retries: 10
  delay: 5
  changed_when: false

- name: Install Cilium via Helm
  kubernetes.core.helm:
    name: cilium
    chart_ref: cilium/cilium
    chart_version: "{{ cilium_version }}"
    release_namespace: kube-system
    create_namespace: false
    values:
      operator:
        replicas: 1
      ipam:
        mode: kubernetes
      kubeProxyReplacement: "true"
      k8sServiceHost: "{{ ansible_host }}"
      k8sServicePort: "6443"
      hubble:
        enabled: true
        relay:
          enabled: true
        ui:
          enabled: true
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml

- name: Wait for Cilium pods to be ready
  command: k3s kubectl -n kube-system wait --for=condition=ready pod -l app.kubernetes.io/part-of=cilium --timeout=300s
  register: cilium_ready
  retries: 5
  delay: 30
  until: cilium_ready.rc == 0
  changed_when: false

- name: Verify Cilium installation
  command: k3s kubectl -n kube-system get pods -l app.kubernetes.io/part-of=cilium
  register: cilium_pods
  changed_when: false

- name: Display Cilium pod status
  debug:
    var: cilium_pods.stdout_lines
